[tox]
requires =
    tox>=4.32
env_list =
    lint
    py{py3}
    py{311-315}
    py{314-315}t

[testenv]
deps =
    pytest
pass_env =
    FORCE_COLOR
commands =
    {envpython} -m pytest {posargs}

[testenv:lint]
skip_install = true
deps =
    prek
pass_env =
    PREK_COLOR
commands =
    prek run --all-files --show-diff-on-failure
